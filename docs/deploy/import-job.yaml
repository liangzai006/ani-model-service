# RBAC for the Model Pod that creates and observes import Jobs. The dynamically
# created import Job uses the Model Deployment's ani-model-service account and
# does not need Kubernetes API permissions of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-model-import-controller
  namespace: ani-model
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ani-model-import-controller
  namespace: ani-model
subjects:
  - kind: ServiceAccount
    name: ani-model-service
    namespace: ani-model
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ani-model-import-controller

# Add these variables to the Model Deployment:
#
#   ANI_IMPORT_KUBERNETES_NAMESPACE=ani-model
#   ANI_IMPORT_JOB_IMAGE=registry.example/ani-model-import:v1
#   ANI_IMPORT_PROVIDER_SECRET=ani-model-import-provider
#   ANI_IMPORT_STORAGE_CLASS=cephfs       # optional; empty uses cluster default
#
# The worker always estimates the staging PVC from the provider manifest and
# rejects the task when the model size cannot be determined. There is no manual
# storage-size override.
#
# The controller creates a task-scoped Secret containing the signed upload URL
# and deletes it after the Job finishes. Create the optional provider Secret out
# of band; it can contain MODELSCOPE_API_TOKEN and/or HF_TOKEN for the provider
# CLI.
#
#   kubectl -n ani-model create secret generic ani-model-import-provider \
#     --from-literal=MODELSCOPE_API_TOKEN='...'
