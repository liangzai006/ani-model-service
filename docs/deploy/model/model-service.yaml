# New-cluster Model service only. Secrets are created out of band in the
# ani-system namespace and are intentionally not stored in this manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: ani-system
  labels:
    ani.liangzai006.io/environment: new-cluster
    ani.liangzai006.io/purpose: ani-services
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ani-model-service
  namespace: ani-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-model-import-controller
  namespace: ani-system
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ani-model-import-controller
  namespace: ani-system
subjects:
  - kind: ServiceAccount
    name: ani-model-service
    namespace: ani-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ani-model-import-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ani-model-service
  namespace: ani-system
  labels:
    app.kubernetes.io/name: ani-model-service
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ani-model-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ani-model-service
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: ani-model-service
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: model
          image: docker.changqingyun.cn/ani/model-service:ani-model-new-20260928-r4@sha256:eeee0e60a5a0ac75312be93a27fd8251af925fb379773579548332345c75a914
          imagePullPolicy: IfNotPresent
          env:
            - name: ANI_SERVER_GRPC_ADDR
              value: 0.0.0.0:19090
            - name: ANI_SERVER_GRPC_TIMEOUT
              value: 30s
            - name: ANI_SERVER_ADMIN_ADDR
              value: 0.0.0.0:19091
            - name: ANI_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: ani-model-database
                  key: dsn
            - name: ANI_MINIO_ENDPOINT
              value: minio.ani-foundation.svc.cluster.local:9000
            - name: ANI_MINIO_SECURE
              value: "false"
            - name: ANI_MINIO_BUCKET
              value: ani-models
            # Shared-bucket mode matches the current importer/finalizer key
            # contract. Tenant buckets remain disabled until that contract is
            # corrected and regression-tested.
            - name: ANI_MINIO_TENANT_BUCKETS
              value: "false"
            - name: ANI_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ani-model-minio
                  key: ANI_MINIO_ACCESS_KEY
            - name: ANI_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ani-model-minio
                  key: ANI_MINIO_SECRET_KEY
            - name: ANI_IMPORT_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ANI_IMPORT_JOB_IMAGE
              value: docker.changqingyun.cn/ani/model-import-worker:ani-model-new-20260928-r2@sha256:e8cbf686d3fa4f3661cb396f2d8d67e5767ae4d790b8331b0df5831bd0f5e8f0
            - name: ANI_IMPORT_STORAGE_CLASS
              value: cephfs
            - name: ANI_IMPORT_WORKER_OWNER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ANI_ALLOW_DIRECT_ACCESS
              value: "true"
            - name: ANI_INFERENCE_GRPC_ADDR
              value: ani-inference-grpc.ani-system.svc.cluster.local:19090
          ports:
            - name: grpc
              containerPort: 19090
            - name: admin
              containerPort: 19091
          volumeMounts:
            - name: public-ca-certificates
              mountPath: /etc/ssl/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: public-ca-certificates
          configMap:
            name: ani-model-public-ca
            items:
              - key: ca-certificates.crt
                path: ca-certificates.crt
---
apiVersion: v1
kind: Service
metadata:
  name: ani-model-grpc
  namespace: ani-system
  labels:
    app.kubernetes.io/name: ani-model-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ani-model-service
  ports:
    - name: grpc
      port: 19090
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: ani-model-admin
  namespace: ani-system
  labels:
    app.kubernetes.io/name: ani-model-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ani-model-service
  ports:
    - name: admin
      port: 19091
      targetPort: admin
