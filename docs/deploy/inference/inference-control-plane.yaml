# New-cluster Inference service. This manifest runs the Kubernetes runtime
# controller in the isolated ani-inference namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: ani-inference
  labels:
    ani.liangzai006.io/environment: new-cluster
    ani.liangzai006.io/purpose: inference-runtime
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ani-inference
  namespace: ani-inference
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-inference-runtime
  namespace: ani-inference
rules:
  - apiGroups: ["ani.kubercloud.com"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ani.kubercloud.com"]
    resources: ["inferenceservices/status", "inferenceservices/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["leaderworkerset.x-k8s.io"]
    resources: ["leaderworkersets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ani-inference-runtime
  namespace: ani-inference
subjects:
  - kind: ServiceAccount
    name: ani-inference
    namespace: ani-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ani-inference-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: ani-inference-grpc
  namespace: ani-inference
  labels:
    app.kubernetes.io/name: ani-inference-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ani-inference-service
  ports:
    - name: grpc
      port: 19090
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: ani-inference-admin
  namespace: ani-inference
  labels:
    app.kubernetes.io/name: ani-inference-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ani-inference-service
  ports:
    - name: admin
      port: 19091
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ani-inference-service
  namespace: ani-inference
  labels:
    app.kubernetes.io/name: ani-inference-service
    app.kubernetes.io/component: runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ani-inference-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ani-inference-service
        app.kubernetes.io/component: runtime
    spec:
      serviceAccountName: ani-inference
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      nodeSelector:
        kubernetes.io/hostname: ani-k8s-cp
      containers:
        - name: inference
          image: docker.changqingyun.cn/ani/inference-service:ani-inference-new-20260923-engine-argv-r1@sha256:46cf4e51049b974e4252b0c335be68ad6c3c2f046284bfd9bb4574473631eb53
          imagePullPolicy: IfNotPresent
          env:
            - name: ANI_SERVER_GRPC_ADDR
              value: 0.0.0.0:19090
            - name: ANI_SERVER_ADMIN_ADDR
              value: 0.0.0.0:19091
            - name: ANI_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: inference-database
                  key: dsn
            - name: ANI_INFERENCE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ANI_HIGRESS_GATEWAY_NAMESPACE
              value: higress-system
            - name: ANI_HIGRESS_GATEWAY_NAME
              value: ani-higress
            - name: ANI_HIGRESS_ROUTE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ANI_HIGRESS_PUBLIC_BASE_URL
              value: http://192.168.102.68:30090
            - name: ANI_HIGRESS_PATH_PREFIX
              value: /v1/completions
            - name: ANI_MODEL_GRPC_ADDR
              value: ani-model-grpc.ani-model.svc.cluster.local:19090
            - name: ANI_MODEL_MATERIALIZER_IMAGE
              value: docker.changqingyun.cn/ani/model-import-worker:ani-model-new-20260921-r1@sha256:c8283c4e5b45a246c4684d6cb3ef6e298846c3c0c7798468f557e6cd22ba8e16
            - name: ANI_MODEL_STORAGE_CLASS
              value: cephfs
          ports:
            - name: grpc
              containerPort: 19090
            - name: admin
              containerPort: 19091
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
