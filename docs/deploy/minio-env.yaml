# Embed this env block in the Model Deployment/Job. The Secret values stay in
# Kubernetes and are never committed to the repository.
env:
  - name: ANI_MINIO_ENDPOINT
    value: ani-s05-minio.ani-s05-objectstore.svc:9000
  - name: ANI_MINIO_SECURE
    value: "false"
  - name: ANI_MINIO_BUCKET
    value: ani-models
  # Set to "true" to use one MinIO bucket per tenant UUID. The service checks
  # and creates that bucket lazily before a remote import download.
  - name: ANI_MINIO_TENANT_BUCKETS
    value: "true"
  # Production imports run in a separate Job. The Job entrypoint is the
  # minio-provision binary built into ANI_IMPORT_JOB_IMAGE.
  - name: ANI_IMPORT_EXECUTION_MODE
    value: kubernetes
  - name: ANI_IMPORT_KUBERNETES_NAMESPACE
    value: ani-model-inference
  - name: ANI_IMPORT_JOB_IMAGE
    value: registry.example/ani-model-import:v1
  - name: ANI_IMPORT_JOB_SERVICE_ACCOUNT
    value: ani-model-import-job
  - name: ANI_IMPORT_MINIO_SECRET
    value: ani-model-import-minio
  - name: ANI_IMPORT_PROVIDER_SECRET
    value: ani-model-import-provider
  - name: ANI_IMPORT_STORAGE_CLASS
    # Optional. Omit this variable to let Kubernetes select its default
    # StorageClass.
    value: ""
  - name: ANI_IMPORT_STORAGE_SIZE
    # Optional. The worker estimates it from the provider manifest and adds
    # headroom; set this explicitly for private/unknown manifests.
    value: ""
  - name: ANI_MINIO_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: ani-s05-minio-root
        key: access_key_id
  - name: ANI_MINIO_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: ani-s05-minio-root
        key: secret_access_key
