{{- if and .Values.inference.grpcAddress .Values.inference.tls.certificate.create }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ required "inference.tls.existingSecret is required" .Values.inference.tls.existingSecret }}
  labels:
    {{- include "ani-model.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.inference.tls.existingSecret }}
  dnsNames:
    - {{ required "inference.tls.certificate.dnsName is required" .Values.inference.tls.certificate.dnsName | quote }}
  usages:
    - digital signature
    - client auth
  issuerRef:
    name: {{ .Values.tls.certificate.issuer.name }}
    kind: {{ .Values.tls.certificate.issuer.kind }}
    group: {{ .Values.tls.certificate.issuer.group }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
{{- end }}
