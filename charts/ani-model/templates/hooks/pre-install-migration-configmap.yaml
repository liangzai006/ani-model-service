{{- if .Values.migration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ani-model.fullname" . }}-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ani-model.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": {{ .Values.migration.hookDeletePolicy }}
data:
  migrate.sh: |-
{{ .Files.Get "files/migrate.sh" | indent 4 }}
{{- range $path, $_ := .Files.Glob "migrations/*.sql" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
