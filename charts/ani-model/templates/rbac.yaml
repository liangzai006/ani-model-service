apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-model-import-controller
  labels:
    {{- include "ani-model.labels" . | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ani-model-import-controller
  labels:
    {{- include "ani-model.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: ani-model-service
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ani-model-import-controller
