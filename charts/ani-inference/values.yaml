replicaCount: 1

fullnameOverride: ""

image:
  repository: docker.changqingyun.cn/ani/inference-service
  tag: ani-inference-new-20260930-cleanup-limit-r2
  digest: sha256:4639122b2269c86e50402f898090714555818dc587a015e69c76ba9f87700022
  pullPolicy: IfNotPresent

imagePullSecrets: []

database:
  existingSecret: inference-database
  secretKey: dsn

model:
  grpcAddress: ani-model-grpc.ani-model.svc.cluster.local:19090
  materializerImage: docker.changqingyun.cn/ani/model-import-worker:ani-model-new-20260928-r2@sha256:e8cbf686d3fa4f3661cb396f2d8d67e5767ae4d790b8331b0df5831bd0f5e8f0
  storageClass: cephfs

higress:
  # Required by the inference service for publishing model routes.
  publicBaseURL: ""
  gatewayNamespace: higress-system
  gatewayName: ani-higress
  pathPrefix: /v1/completions
  rateLimitNamespace: higress-system
  rateLimitPlugin: ani-request-rate-limit
  rbac:
    create: true
    # Empty follows rateLimitNamespace; set this only when the plugin role
    # intentionally lives in a different namespace.
    namespace: ""

# GPU resolution is opt-in. The accelerator client always uses TLS/mTLS.
accelerator:
  enabled: false
  grpcAddress: ""
  clusterID: ""
  serverName: ""
  tls:
    secretName: ""
    caFile: /var/run/secrets/accelerator/ca.crt
    certFile: /var/run/secrets/accelerator/tls.crt
    keyFile: /var/run/secrets/accelerator/tls.key

service:
  type: ClusterIP
  grpcPort: 19090
  adminPort: 19091

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true

securityContext: {}
